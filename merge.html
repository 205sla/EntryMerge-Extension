<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EntryMerge - 엔트리 작품 합치기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
  <h1>EntryMerge</h1>
  <p class="subtitle">엔트리 작품(.ent) 파일을 합쳐보세요</p>
  <p class="limit-info">파일당 최대 50MB · 전체 최대 150MB · 최대 10개</p>

  <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label=".ent 파일 선택">
    <div class="icon">📂</div>
    <p>.ent 파일을 여기에 드래그하거나 클릭하여 선택</p>
  </div>
  <input type="file" id="fileInput" multiple accept=".ent" aria-hidden="true">

  <ul class="file-list" id="fileList"></ul>
  <div class="total-size" id="totalSize"></div>

  <button id="mergeBtn" disabled>작품 합치기</button>
  <button class="extra-toggle" id="extraToggle" type="button" aria-expanded="false" aria-controls="extraSettings">기타 설정</button>
  <div class="extra-settings" id="extraSettings">
    <fieldset class="remake-settings">
      <legend>리메이크 출처</legend>
      <label><input type="radio" name="remakeMode" value="default" checked> 기존 기본 작품으로 표시</label>
      <label><input type="radio" name="remakeMode" value="hidden"> 리메이크 표시 숨기기</label>
      <label><input type="radio" name="remakeMode" value="source"> 합친 작품 중에서 선택</label>
      <div class="remake-source-control">
        <label for="remakeSource">정보를 가져올 작품</label>
        <select id="remakeSource" disabled aria-describedby="remakeSourceHelp">
          <option value="">먼저 작품 파일을 추가해주세요</option>
        </select>
        <p class="setting-help" id="remakeSourceHelp">선택한 작품의 parent, origin, user 값을 유지합니다.</p>
      </div>
    </fieldset>
    <label><input type="checkbox" id="hideTimerAnswer"> 대답, 초시계 숨기기</label>
  </div>
  <div class="status" id="status"></div>

  <div class="tools-family-wrap">
    <a
      href="https://도구.엔트리.org"
      target="_blank"
      rel="noreferrer"
      aria-label="도구.엔트리.org 에서 다른 도구 보러가기"
      class="tools-family-link"
    >
      <span>다른 도구 보러가기</span>
      <span aria-hidden="true" class="tfl-divider"></span>
      <span class="tfl-brand">도구.엔트리.org</span>
      <span aria-hidden="true" class="tfl-arrow">&rarr;</span>
    </a>
  </div>

  <div class="footer">
    문의: <a href="mailto:205@205.kr">205@205.kr</a> · <a href="https://github.com/205sla/EntryMergeServer" target="_blank" rel="noopener">GitHub</a>
  </div>
  <div class="version-badge">Chrome Extension v1.2.0</div>
</div>

<!-- Progress overlay -->
<div
  class="progress-overlay"
  id="progressOverlay"
  role="dialog"
  aria-modal="true"
  aria-labelledby="progressMsg"
  aria-hidden="true"
>
  <div class="progress-box">
    <div class="progress-icon" aria-hidden="true">⚙️</div>
    <p
      class="progress-msg"
      id="progressMsg"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >작품을 합치는 중...</p>
    <div
      class="progress-bar-wrap"
      id="progressBarTrack"
      role="progressbar"
      aria-labelledby="progressMsg"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-pct" id="progressPct" aria-hidden="true">0%</div>
    <button class="progress-close" id="progressClose">닫기</button>
  </div>
</div>

<script src="js/pako.min.js"></script>
<script src="js/tar.js"></script>
<script src="js/merge-core.js"></script>
<script src="js/merge-engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
